# Runs the registry image — CI (.gitlab/ci/build.yml) builds and pushes $CI_REGISTRY_IMAGE:latest
# from the default branch. Paths and ports are baked into the image (docker/Dockerfile ENV) — set
# only what differs for this deployment. On a host with a reverse proxy, bind the port to
# 127.0.0.1 instead.
services:

  leios-api:
    image: gcr.leicraftmc.de/leios/api-server:latest
    container_name: leios-api
    restart: unless-stopped
    ports:
      - "12151:12151"
    environment:
      LRA_LOG_LEVEL: info

      LRA_APP_URL: https://hub.leios.dev

      LRA_API_DISABLE_DOCS: false
      # true behind a reverse proxy that sets X-Forwarded-For (per-client rate limits)
      LRA_API_TRUST_PROXY: true

      LRA_S3_ENDPOINT: "https://s3.example.com"
      LRA_S3_REGION: "garage"
      LRA_S3_BUCKET: "leios-repo"
      LRA_S3_PREFIX: "leios/"
      LRA_S3_ACCESS_KEY_ID: "YourAccessKeyIdHere"
      LRA_S3_SECRET_ACCESS_KEY: "YourSecretAccessKeyHere"

      LRA_SMTP_HOST: "mail.example.com"
      LRA_SMTP_PORT: 465
      LRA_SMTP_USERNAME: "YourSMTPUsernameHere"
      LRA_SMTP_PASSWORD: "YourSMTPPasswordHere"
      LRA_SMTP_FROM: '"LeiOS" <noreply@leios.dev>'
      LRA_SMTP_SECURE: true

    volumes:
      - /opt/leios/api/data:/opt/leios/api/data
      - /opt/leios/api/config:/opt/leios/api/config
