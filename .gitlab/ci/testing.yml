default:
  image: oven/bun
  interruptible: true
  cache:
    key:
      files:
        - bun.lock
    paths:
      - .bun/install/cache/
      - node_modules/
  before_script:
    # Host tools the integration tests need: dpkg/dpkg-dev/build-essential for .deb checks and the
    # branding package build, unzip for the Aptly download, gnupg for the generated test keys.
    - apt-get update
    - DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git bzip2 dpkg gnupg unzip ca-certificates curl dpkg-dev build-essential
    - rm -rf /var/lib/apt/lists/*
    - bun install --frozen-lockfile

variables:
  BUN_INSTALL_CACHE_DIR: .bun/install/cache

test:lint:
  stage: test
  before_script:
    - bun install --frozen-lockfile
  script:
    - bun run check:ci

test:typecheck:
  stage: test
  before_script:
    - bun install --frozen-lockfile
  script:
    - bun run typecheck

test:unit:
  stage: test
  script:
    - bun run test:ci
  # The "All files" row of bun's coverage table; the capture group picks the % Lines column.
  coverage: '/All files\s*\|\s*[\d.]+\s*\|\s*([\d.]+)/'
  artifacts:
    when: always
    reports:
      junit: junit.xml
